[pytest]
minversion = 7.0
testpaths = tests
pythonpath = .
python_files = test_*.py
python_functions = test_*
addopts = -ra --strict-markers --tb=short
markers =
    student: student assignment tests (skipped until implemented)
    smoke: infrastructure smoke tests
    ui: browser UI tests
    e2e: end-to-end scenarios
    api: HTTP API tests
    performance: timing and scalability tests
    observability: event coverage tests
    load: heavy load tests (opt-in, not part of default smoke)
    slow: long-running measurements
filterwarnings =
    ignore::DeprecationWarning
